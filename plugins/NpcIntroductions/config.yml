# Any messages the plugin might send to players.
messages:
  # The prefix shown in front of messages.
  prefix: "&f&lNPC 介绍 &8&l» &7"
  # Shown AFTER the configuration has been reloaded.
  reload: "配置已重载"

# The amount of seconds in between messages and between the final message and the command.
seconds-between-actions: 2

# List of NPCs that should do something
introductions:
  1:
    messages:
      - "&e[NPC] Leo&f: &f你可以通过提升 &a橡木收集&f 进度来解锁 &a叶片护甲"
      - "&e[NPC] Leo&f: &b村庄&f&f西方有一片&b森林&f，你可以在那里收集橡木"
      - "&e[NPC] Leo&f: &f想查看你的收集进度和奖励，打开 &a空岛生存菜单&f 中的 &a收集菜单&f！"
    message-sound: "ENTITY_VILLAGER_NO"
    command: "[player]talkedcommand"
  2:
    messages:
      - "&e[NPC] Duke&f: &f你是新来的吗？你可以看到这里有很多东西值得探索！"
      - "&e[NPC] Duke&f: &f我的建议是一开始先去 &b农场&f，或是 &b煤炭矿区&f，它们都在这的西边或南边"
      - "&e[NPC] Duke&f: &f如果你需要一些木头，最好的采伐地点在 &b村庄 &f的北方！"
    message-sound: "ENTITY_VILLAGER_NO"
    command: "[player]talkedcommand"
  3:
    messages:
