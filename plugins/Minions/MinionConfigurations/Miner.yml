      Close: true
    '6':
      slot: 6
      Material: ARMOR_STAND
      Data_Value: 0
      Name: '&6Walk Mine'
      Lore: 
        - '&7Walk Mining: &f%minion_walking%'
        - ''
        - '&7Allows the miner to walk around.'
