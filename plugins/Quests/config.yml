    name: "&6&l你没有权限"
    lore:
    - "&7你没有该任务(&6{quest}&7)的权限"
    type: "BROWN_STAINED_GLASS_PANE"
  quest-cooldown-display:
    name: "&e&l任务冷却中"
    lore:
    - "&7你曾经完成过该任务(&e{quest}&7)"
    - "&7你必须等待 &e{time} &7以再次解锁"
    type: "ORANGE_STAINED_GLASS_PANE"
  quest-completed-display:
    name: "&a&l任务已完成"
    lore:
    - "&7你已经完成了该任务(&a{quest}&7)"
    - "&7并且不能重复完成"
    type: "GREEN_STAINED_GLASS_PANE"
  no-started-quests:
    name: "&c&l没有进行中的任务"
    lore:
    - "&7去尝试一些!"
    type: "FEATHER"
  quest-cancel-yes:
    name: "&a&l确认"
    lore:
    - "&7你确认要取消这个任务"
    - "&7并知晓你会失去所有的进度"
    type: "GREEN_STAINED_GLASS_PANE"
  quest-cancel-no:
    name: "&c&l取消"
    lore:
    - "&7回到任务菜单"
    type: "RED_STAINED_GLASS_PANE"
  quest-cancel-background:
    type: "GRAY_STAINED_GLASS_PANE"

