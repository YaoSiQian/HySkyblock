BuilderSettings:
  Health: 100
  Hunger: 20
  Cost: 100000
  Armor_Color:
    ChestPlate: LIGHTBLUE
    Leggings: LIGHTBLUE
    Boots: LIGHTBLUE
  Ticks_Per_Movement:
    - Minions.permission.movement.player 3
    - Minions.permission.movement.donor 1
  Allow_ChestLinks_In_Other_Worlds: true
  Distance_From_Linkable_Chests:
    - Minions.permission.linkchests.distance.player 25
    - Minions.permission.linkchests.distance.donor 50
  Max_Positions_Distance:
    - Minions.permission.builder.player 100
    - Minions.permission.builder.donor 1000
  Hunger_Loss_Per_Build_Cycle: 1
  Change_Task_Permission: 'Minions.permission.changebuilderstask'
  Default_Minion:
    Name: '&9Builder Minion'
    Head: '%playername%'
    Item: DRAGON_EGG
    Item_Data: 0
    Enchant_Minion_Item: true
    HideAttributes: true
    Minion_Lore:
      Custom_Lore:
        - '&3Right click a block with minion'
        - '&3To place. Once placed minion'
        - '&3Will build for you as long as'
        - '&3You give it blocks.'  
      Data_Lore:
        Minion_Info_Sections: '&a'
        Minion_Data: '&b'
    Default_Held_Item: REDSTONE_BLOCK
  Limits:
    - 'Minions.permission.limit.player 2'
    - 'Minions.permission.limit.donor 5'
  NameTag_Permission: 'Minions.permission.use_nametag.Builder'
  Despawn_On_Death: true
  Spawn_Animation: DAB
  Feed_And_Heal_Minion:
    EnableHunger_And_Health: true
    Feed_With_Food: true
    FoodTypes:
      - COOKED_BEEF 5
      - COOKED_CHICKEN 3
      - BREAD 1
    Feed_With_Money: true
    Food_Cost: 100
    Food_Amount_Per_Cost: 1
    Heal_With_Item: true
    Heal_FoodTypes:
      - GOLDEN_APPLE;0 10
    Heal_With_Money: true
    Heal_Cost: 500
    Heal_Amount_Per_Cost: 1
  Build_Settings:
    Amount_Of_Blocks_Placed_During_Cycle: 10
    Build_In_Order: false
    BlackListed_Blocks:
      - BEDROCK
      - SHULKER_BOX
      - JUKE_BOX
      - CHEST
      - TRAPPED_CHEST
      - DISPENSOR
      - DROPPER
      - HOPPER
BuilderGUI:
  rows: 2
  InventoryName: '&9Builder GUI'
  Items:
    '0':
      slot: 0
      Material: GOLDEN_APPLE
      Data_Value: 0
      Name: '&cHealth &f%minion_health%/100'
      Lore: 
        - '&7You minion loses 1 hp'
        - '&7When its hunger runs out.'
        - '&7Be sure to feed your minion.'
      ItemType: HEALTH
      Close: false
    '1':
      slot: 1
      Material: COOKED_BEEF
      Data_Value: 0
      Name: '&aFood &f%minion_hunger%/20'
      Lore: 
        - '&7You minion loses 1 hunger point'
        - '&7Every Breeding cycle.'
        - '&7Be sure to feed your minion.'
      ItemType: FOOD
      Close: false
    '2':
      slot: 2
      Material: CHEST
      Data_Value: 0
      Name: '&6Link Chest'
      Lore: 
        - '&7Currently Linked: &f%minion_linkedtochest%'
      ItemType: LINK_CHEST
      Close: true
    '3':
      slot: 3
      Material: TRAPPED_CHEST
      Data_Value: 0
      Name: '&6Food Chest'
      Lore: 
        - '&7Currently Linked: &f%minion_linkedfoodchest%'
      ItemType: LINK_FOOD_CHEST
      Close: true
    '4':
      slot: 4
      Material: ''
      SkullName: 'MHF_ArrowLeft'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: WEST'
      ItemType: CHANGE_DIRECTION_WEST
      Close: true
    '5':
      slot: 5
      Material: ''
      SkullName: 'MHF_ArrowRight'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: EAST'
      ItemType: CHANGE_DIRECTION_EAST
      Close: true
    '6':
      slot: 6
      Material: ''
      SkullName: 'MHF_ArrowUp'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: NORTH'
      ItemType: CHANGE_DIRECTION_NORTH
      Close: true
    '7':
      slot: 7
      Material: ''
      SkullName: 'MHF_ArrowDown'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: SOUTH'
      ItemType: CHANGE_DIRECTION_SOUTH
      Close: true
    '8':
      slot: 8
      Material: REDSTONE_BLOCK
      Data_Value: 0
      Name: '&6Change Build Task'
      Lore: 
        - '&7Set the task your builder will'
        - '&7Preform.'
        - ''
        - '&7Left click to set task'
        - '&7Right click to set builders postions.'
      ItemType: CHANGE_BUILDING_TASK
      Close: false
    '9':
      slot: 9
      Material: GLOWSTONE
      Data_Value: 0
      Name: '&6Suits Inventory'
      Lore: 
        - '&7Inventory to change the suit'
        - '&7Your minion is wearing.'
      ItemType: SUITS_INVENTORY
      Close: false