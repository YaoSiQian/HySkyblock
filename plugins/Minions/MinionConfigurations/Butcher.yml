ButcherSettings:
  Health: 100
  Hunger: 20
  Cost: 100000
  Armor_Color:
    ChestPlate: RED
    Leggings: RED
    Boots: RED
  Ticks_Per_Movement:
    - Minions.permission.movement.player 3
    - Minions.permission.movement.donor 1
  Allow_ChestLinks_In_Other_Worlds: true
  Distance_From_Linkable_Chests:
    - Minions.permission.linkchests.distance.player 25
    - Minions.permission.linkchests.distance.donor 50
  Custom_Sword_Permission: Minions.permission.custom_sword
  Hunger_Loss_Per_Kill_Cycle: 10
  Default_Minion:
    Name: '&eButcher Minion'
    Head: '%playername%'
    Item: DRAGON_EGG
    Item_Data: 0
    Enchant_Minion_Item: true
    HideAttributes: true
    Minion_Lore:
      Custom_Lore:
        - '&3Right click a block with minion'
        - '&3To place. Once placed minion'
        - '&3Will kill mobs continuously until'
        - '&3Death. Remember to feed it.'
      Data_Lore:
        Minion_Info_Sections: '&a'
        Minion_Data: '&b'
    Default_Held_Item: IRON_SWORD
  Limits:
    - 'Minions.permission.limit.player 2'
    - 'Minions.permission.limit.donor 5'
  NameTag_Permission: 'Minions.permission.use_nametag.butcher'
  Despawn_On_Death: true
  Spawn_Animation: DAB
  Feed_And_Heal_Minion:
    EnableHunger_And_Health: true
    Feed_With_Food: true
    FoodTypes:
      - COOKED_BEEF 5
      - COOKED_CHICKEN 3
      - BREAD 1
    Feed_With_Money: true
    Food_Cost: 100
    Food_Amount_Per_Cost: 1
    Heal_With_Item: true
    Heal_FoodTypes:
      - GOLDEN_APPLE;0 10
    Heal_With_Money: true
    Heal_Cost: 500
    Heal_Amount_Per_Cost: 1
  Bottle_Collected_EXP: true
  Kill_Settings:
    Multiply_EXP_By_StackedEntity: true
    Kill_Amount_From_Stack: -1
    Kill_Radius:
      - Minions.permission.radius.player 5
      - Minions.permission.radius.donor 10
    Default_Radius: 5
    Experience_Multiplier:
      - Minions.permission.expmultiplier.player 1
      - Minions.permission.expmultiplier.donor 3
    Damage: false
    Damage_Amount: 5
    Damage_Passive: false
    Use_Mob_Whitelist: false
    Damage_Named_Entities: false
    Mob_Whitelist:
      - ZOMBIE
      - SKELETON
      - CREEPER
      - SPIDER
    Mob_Names_BlackList:
      - '&6Spider Jockey'
      - '&dA Skeleton'
    MobCoin_Permission: 'Minion.butcher.mobcoins'
    MobCoin_Hooks:
      QuadrexMobCoins:
        Enabled: false
        Min: 1
        Max: 5
        Multiply_By_Stack: false
ButcherGUI:
  rows: 2
  InventoryName: '&eButcher GUI'
  Items:
    '0':
      slot: 0
      Material: GOLDEN_APPLE
      Data_Value: 0
      Name: '&cHealth &f%minion_health%/100'
      Lore: 
        - '&7You minion loses 1 hp'
        - '&7When its hunger runs out.'
        - '&7Be sure to feed your minion.'
      ItemType: HEALTH
      Close: false
    '1':
      slot: 1
      Material: COOKED_BEEF
      Data_Value: 0
      Name: '&aFood &f%minion_hunger%/20'
      Lore: 
        - '&7You minion loses 1 hunger point'
        - '&7Every mob it kills.'
        - '&7Be sure to feed your minion.'
      ItemType: FOOD
      Close: false
    '2':
      slot: 2
      Material: CHEST
      Data_Value: 0
      Name: '&6Link Chest'
      Lore: 
        - '&7Currently Linked: &f%minion_linkedtochest%'
      ItemType: LINK_CHEST
      Close: true
    '3':
      slot: 3
      Material: TRAPPED_CHEST
      Data_Value: 0
      Name: '&6Food Chest'
      Lore: 
        - '&7Currently Linked: &f%minion_linkedfoodchest%'
      ItemType: LINK_FOOD_CHEST
      Close: true
    '4':
      slot: 4
      Material: EXP_BOTTLE
      Data_Value: 0
      Name: '&6Collected EXP'
      Lore: 
        - '&7EXP Collected: &f%minion_collected_exp%'
      ItemType: COLLECT_EXP
      Close: true
    '5':
      slot: 5
      Material: ''
      SkullName: 'MHF_ArrowLeft'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: WEST'
      ItemType: CHANGE_DIRECTION_WEST
      Close: true
    '6':
      slot: 6
      Material: ''
      SkullName: 'MHF_ArrowRight'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: EAST'
      ItemType: CHANGE_DIRECTION_EAST
      Close: true
    '7':
      slot: 7
      Material: ''
      SkullName: 'MHF_ArrowUp'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: NORTH'
      ItemType: CHANGE_DIRECTION_NORTH
      Close: true
    '8':
      slot: 8
      Material: ''
      SkullName: 'MHF_ArrowDown'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: SOUTH'
      ItemType: CHANGE_DIRECTION_SOUTH
      Close: true
    '9':
      slot: 9
      Material: ARROW
      Data_Value: 0
      Name: '&6Set Radius'
      Lore: 
        - '&7Set the radius of your minion.'
        - '&7Current Range: %minion_radius%'
        - '&7Max: %range_max% Min: %range_min%'
        - '&7Left click to raise'
