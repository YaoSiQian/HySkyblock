CrafterSettings:
  Health: 100
  Hunger: 20
  Cost: 100000
  Armor_Color:
    ChestPlate: LIGHTBLUE
    Leggings: LIGHTBLUE
    Boots: LIGHTBLUE
  Ticks_Per_Movement:
    - Minions.permission.movement.player 3
    - Minions.permission.movement.donor 1
  Allow_ChestLinks_In_Other_Worlds: true
  Distance_From_Linkable_Chests:
    - Minions.permission.linkchests.distance.player 25
    - Minions.permission.linkchests.distance.donor 50
  Hunger_Loss_Per_Craft_Cycle: 1
  Default_Minion:
    Name: '&9Crafter Minion'
    Head: '%playername%'
    Item: DRAGON_EGG
    Item_Data: 0
    Enchant_Minion_Item: true
    HideAttributes: true
    Minion_Lore:
      Custom_Lore:
        - '&3Right click a block with minion'
        - '&3To place. Once placed minion'
        - '&3Will craft items from its linked'
        - '&3chest continuously until'
        - '&3Death. Remember to feed it.'
      Data_Lore:
        Minion_Info_Sections: '&a'
        Minion_Data: '&b'
    Default_Held_Item: WORKBENCH
  Limits:
    - 'Minions.permission.limit.player 2'
    - 'Minions.permission.limit.donor 5'
  Crafts_Per_Craftable_Items:
    - 'Minions.permission.crafts.player 1'
    - 'Minions.permission.crafts.donor 5'
  Drop_On_Craft: false
  NameTag_Permission: 'Minions.permission.use_nametag.Crafter'
  Despawn_On_Death: true
  Spawn_Animation: DAB
  Feed_And_Heal_Minion:
    EnableHunger_And_Health: true
    Feed_With_Food: true
    FoodTypes:
      - COOKED_BEEF 5
      - COOKED_CHICKEN 3
      - BREAD 1
    Feed_With_Money: true
    Food_Cost: 100
    Food_Amount_Per_Cost: 1
    Heal_With_Item: true
    Heal_FoodTypes:
      - GOLDEN_APPLE;0 10
    Heal_With_Money: true
    Heal_Cost: 500
    Heal_Amount_Per_Cost: 1
  Craftables_GUI_Name: 'Items to be crafted:'
CrafterGUI:
  rows: 2
  InventoryName: '&9Crafter GUI'
  Items:
    '0':
      slot: 0
      Material: GOLDEN_APPLE
      Data_Value: 0
      Name: '&cHealth &f%minion_health%/100'
      Lore: 
        - '&7You minion loses 1 hp'
        - '&7When its hunger runs out.'
        - '&7Be sure to feed your minion.'
      ItemType: HEALTH
      Close: false
    '1':
      slot: 1
      Material: COOKED_BEEF
      Data_Value: 0
      Name: '&aFood &f%minion_hunger%/20'
      Lore: 
        - '&7You minion loses 1 hunger point'
        - '&7Every Breeding cycle.'
        - '&7Be sure to feed your minion.'
      ItemType: FOOD
      Close: false
    '2':
      slot: 2
      Material: CHEST
      Data_Value: 0
      Name: '&6Link Chest'
      Lore: 
        - '&7Currently Linked: &f%minion_linkedtochest%'
      ItemType: LINK_CHEST
      Close: true
    '3':
      slot: 3
      Material: TRAPPED_CHEST
      Data_Value: 0
      Name: '&6Food Chest'
      Lore: 
        - '&7Currently Linked: &f%minion_linkedfoodchest%'
      ItemType: LINK_FOOD_CHEST
      Close: true
    '4':
      slot: 4
      Material: ''
      SkullName: 'MHF_ArrowLeft'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: WEST'
      ItemType: CHANGE_DIRECTION_WEST
      Close: true
    '5':
      slot: 5
      Material: ''
      SkullName: 'MHF_ArrowRight'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: EAST'
      ItemType: CHANGE_DIRECTION_EAST
      Close: true
    '6':
      slot: 6
      Material: ''
      SkullName: 'MHF_ArrowUp'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: NORTH'
      ItemType: CHANGE_DIRECTION_NORTH
      Close: true
    '7':
      slot: 7
      Material: ''
      SkullName: 'MHF_ArrowDown'
      Data_Value: 0
      Name: '&6Change Direction'
      Lore: 
        - '&7Set minion direction: SOUTH'
      ItemType: CHANGE_DIRECTION_SOUTH
      Close: true
    '8':
      slot: 8
      Material: GLOWSTONE
      Data_Value: 0
      Name: '&6Suits Inventory'
      Lore: 
        - '&7Inventory to change the suit'
        - '&7Your minion is wearing.'
      ItemType: SUITS_INVENTORY
      Close: false
    '9':
      slot: 9
      Material: WORKBENCH
      Data_Value: 0
      Name: '&6Craftables Inventory'
      Lore: 
        - '&7Add or remove items that'
        - '&7The minion will craft.'
        - ''
        - '&7Crafts Per Item: %crafts_per_item%'
        - ''
        - '&7Shift left click to raise.'
        - '&7Shift right click to lower.'
      ItemType: CRAFTABLE_INVENTORY
      Close: false