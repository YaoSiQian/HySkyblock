        - '[message] &c你至少需要任一技能达到 V 级才能移除你的主大厅传送门!'

      remove-nether-portal-no:
        material: NETHER_BRICK
        slot: 28
        priority: 1
        display_name: '&a移除主大厅传送门'
        minimum_requirements: 2
        view_requirement:
          requirements:
            level:
              type: '>='
              input: '%math_0_({skills_farming_level}+{skills_mining_level}+{skills_combat_level}+{skills_foraging_level}+{skills_fishing_level}+{skills_enchanting_level}+{skills_alchemy_level})%'
              output: 5
            island:
              type: '!string equals ignorecase'
              input: '%bskyblock_visited_island_owner%'
              output: '%player_name%'
        lore:
        - '&7移除你岛屿上主大厅传送门的'
        - '&7所有传送门方块!'
        - ''
        - '&e点击移除!'
        left_click_commands:
        - '[message] &c你只能移除自己岛屿的主大厅传送门!'
        - '[close]'
        right_click_commands:
        - '[message] &c你只能移除自己岛屿的主大厅传送门!'
        - '[close]'

      remove-nether-portal-yes:
        material: NETHER_BRICK
        slot: 28
        priority: 2
        display_name: '&a移除主大厅传送门'
        minimum_requirements: 2
        view_requirement:
          requirements:
            level:
              type: '>='
              input: '%math_0_({skills_farming_level}+{skills_mining_level}+{skills_combat_level}+{skills_foraging_level}+{skills_fishing_level}+{skills_enchanting_level}+{skills_alchemy_level})%'
              output: 5
            island:
              type: string equals ignorecase
              input: '%bskyblock_visited_island_owner%'
              output: '%player_name%'
        lore:
        - '&7移除你岛屿上主大厅传送门的'
        - '&7所有传送门方块!'
        - ''
        - '&e点击移除!'
        left_click_commands:
        - '[console] removehubportal %player_name%'
        - '[message] &a你已经成功移除主大厅传送门!'
        - '[close]'
        right_click_commands:
        - '[console] removehubportal %player_name%'
        - '[message] &a你已经成功移除主大厅传送门!'
        - '[close]'
        

