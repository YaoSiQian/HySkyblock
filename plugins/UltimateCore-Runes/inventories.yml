backButtons: true
runeTableGUI:
  size: 54
  title: 符文基架
  items:
    errorItem:
      material: BARRIER
      amount: 1
      title: '&cError'
      lore:
      - '%error_information%'
      isGlowing: false
    infoItem:
      material: BARRIER
      amount: 1
      title: '&c符文基架'
      lore:
      - '&7将目标物品放在左边的槽'
      - '&7并且把将要赋予的符文放在右边'
      - '&7来将符文赋予到物品上'
      - '&7或者将两个符文放在槽位内来融合它们!'
      isGlowing: false
    runeButton:
      material: END_PORTAL_FRAME
      amount: 1
      title: '&a将符文赋予到物品上 或 融合两个符文'
      lore:
      - '&7将你的符文赋予到物品上'
      - '&7或者融合两个符文'
      isGlowing: false
    runeButtonToFuse:
      material: END_PORTAL_FRAME
      amount: 1
      title: '&a将符文赋予到物品上 或 融合两个符文'
      lore:
      - '&7你可以将两个同种类型和等级的符文'
      - '&7融合来成一个更高等级的符文'
      - ''
      - '&c警告: 假如你融合符文失败'
      - '&c你会失去其中一个符文!'
      - ''
      - '&7成功概率: &a%success_chance%%'
      - '&7失败概率: &c%fail_chance%%'
      - ''
      - '&e尝试融合符文!'
      isGlowing: false
    runeTableGlass:
      material: WHITE_STAINED_GLASS_PANE
      amount: 1
      title: ' '
      lore: []
      isGlowing: false
