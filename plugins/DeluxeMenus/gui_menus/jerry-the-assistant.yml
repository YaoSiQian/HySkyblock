      remove-nether-portal:
        material: NETHER_BRICK
        slot: 28
        priority: 3
        display_name: '&a移除主大厅传送门'
        lore:
        - '&7移除你岛屿上主大厅传送门的'
        - '&7所有传送门方块!'
        - ''
        - '&c需要任一技能达到 V 级!'
